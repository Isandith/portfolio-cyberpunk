<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Subtle yellow glow -->
    <filter id="yellowGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Transparent background -->
  <rect width="512" height="512" fill="none"/>

  <!-- Subtle glitch offset - red -->
  <text x="256" y="350" 
        font-family="Impact, Arial Black, sans-serif" 
        font-size="340" 
        font-weight="900" 
        text-anchor="middle" 
        font-style="italic"
        fill="#FF0000"
        opacity="0.4"
        transform="translate(-4, -3) skewX(-10)">IP</text>
  
  <!-- Main yellow text with stroke -->
  <text x="256" y="350" 
        font-family="Impact, Arial Black, sans-serif" 
        font-size="340" 
        font-weight="900" 
        text-anchor="middle" 
        font-style="italic"
        fill="#FFFF00"
        filter="url(#yellowGlow)"
        stroke="#000000"
        stroke-width="12"
        paint-order="stroke fill"
        transform="skewX(-10)">IP</text>
</svg>
